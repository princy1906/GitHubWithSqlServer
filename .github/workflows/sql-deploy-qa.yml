name: Deploy Database to QA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI workflow run ID containing the DACPAC"
        required: true
        type: string

jobs:
  deploy-qa:

    name: Deploy DACPAC to QA

    runs-on: [self-hosted, windows, x64]

    environment: qa

    steps:

      # --------------------------------------------------
      # 1. Download DACPAC generated by CI
      # --------------------------------------------------

      - name: Download DACPAC from CI
        uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: ./dacpac
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      # --------------------------------------------------
      # 2. Verify DACPAC exists
      # --------------------------------------------------

      - name: Verify DACPAC
        shell: powershell
        run: |
          Write-Host "Checking DACPAC..."

          $dacpac = "./dacpac/DatabaseProjectCustomer.dacpac"

          if (-not (Test-Path $dacpac)) {
              Write-Error "DACPAC was not found at $dacpac"
              exit 1
          }

          Write-Host "DACPAC found:"
          Get-Item $dacpac

      # --------------------------------------------------
      # 3. Deploy DACPAC to QA
      # --------------------------------------------------

      - name: Deploy DACPAC to QA
        shell: powershell
        env:
          CONNECTION_STRING: ${{ secrets.QA_CONNECTION_STRING }}
          AdminRoleId: ${{ vars.AdminRoleId }}
          OwnerRoleId: ${{ vars.OwnerRoleId }}
        run: |
          Write-Host "Deploying DACPAC to QA..."

          sqlpackage `
            /Action:Publish `
            /SourceFile:"./dacpac/DatabaseProjectCustomer.dacpac" `
            /TargetConnectionString:"$env:CONNECTION_STRING" `
            /p:BlockOnPossibleDataLoss=False `
            /v:AdminRoleId="$env:AdminRoleId" `
            /v:OwnerRoleId="$env:OwnerRoleId"

      # --------------------------------------------------
      # 4. Deployment completed
      # --------------------------------------------------

      - name: Deployment completed
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "QA database deployment completed."
          Write-Host "======================================"