name: SQL Database CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check project
        run: |
          pwd
          ls -la
          ls -la DatabaseProjectCustomer
          dotnet --version

      - name: Build SQL Project
        working-directory: DatabaseProjectCustomer
        run: |
          dotnet build ./DatabaseProjectCustomer.sqlproj

      - name: Build SQL Project
        working-directory: DatabaseProjectCustomer
        env:
          AdminRoleId: ${{ vars.AdminRoleId }}
          OwnerRoleId: ${{ vars.OwnerRoleId }}
        run: |
            dotnet build ./DatabaseProjectCustomer.sqlproj `
            /p:AdminRoleId="$env:AdminRoleId" `
            /p:OwnerRoleId="$env:OwnerRoleId"

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: DatabaseProjectCustomer/bin/Debug/DatabaseProjectCustomer.dacpac