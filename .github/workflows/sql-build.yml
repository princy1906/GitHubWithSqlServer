name: SQL Database CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check project
        run: |
          pwd
          ls -la
          ls -la DatabaseProjectCustomer
          dotnet --version

      - name: Build SQL Project
        working-directory: DatabaseProjectCustomer
        run: |
          dotnet build ./DatabaseProjectCustomer.sqlproj 

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: DatabaseProjectCustomer/bin/Debug/DatabaseProjectCustomer.dacpac